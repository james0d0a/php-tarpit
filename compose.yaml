# Requires Docker Engine 24.0.6+ (moby#46221) running as root (not rootless):
# the binary carries the file capability cap_net_bind_service=+ep, which the
# kernel can only honour if the container is granted NET_BIND_SERVICE. Without
# it (older engine, or cap_add removed) the container fails at start with
# "exec ... Operation not permitted".
services:
  sensor:
    build: .
    image: php_tarpit:latest
    restart: unless-stopped
    # Host networking records client source IPs and IPv6 exactly as they arrive.
    network_mode: host
    # Non-root (the image's `nonroot`, uid 65532), read-only root filesystem,
    # no privilege escalation, and only the capability to bind ports < 1024.
    user: "65532:65532"
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    # Each setting resolves as CLI flag > PHP_TARPIT_* variable > persona
    # [settings] > built-in default. Uncomment to override the persona.
    environment:
      # PHP_TARPIT_PERSONA: /etc/php_tarpit/personas/apache-modphp-wordpress.toml
      # PHP_TARPIT_HTTP_PORT: "80"
      # PHP_TARPIT_HTTPS_PORT: "443"
      # PHP_TARPIT_HOSTNAME: web01            # default: kept from the existing cert, else random
      # PHP_TARPIT_APACHE_VERSION: "2.4.62"
      # PHP_TARPIT_PHP_VERSION: "8.3.30"
      # PHP_TARPIT_MAX_CONNECTION_BYTES: 64MiB
      # PHP_TARPIT_MAX_TOTAL_BYTES: 5GiB
      RUST_LOG: info
    volumes:
      # The only writable location: requests.jsonl, connections.jsonl,
      # streams/ (framing), bodies/ (deduplicated payloads by sha256),
      # tls/ (cert, key, hostname, keylog.txt)
      - sensor-data:/data

volumes:
  sensor-data:
