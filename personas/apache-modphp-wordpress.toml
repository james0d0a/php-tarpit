# Apache 2.4 + mod_php + PHP 8.3 (unpatched for php2shell) + WordPress, Debian.
#
# PHP 8.3.30 is below the 8.3.36 fix, so version-detection scanners classify
# this sensor as vulnerable. Headers are listed in Apache's emission order.

name = "apache-modphp-wordpress"

# Lowest-precedence settings layer: CLI flags and PHP_TARPIT_* environment
# variables override these. `{apache_version}`, `{php_version}` and
# `{hostname}` below are filled in from the resolved settings.
[settings]
apache_version = "2.4.62"
php_version = "8.3.30"

[[route]]
path = "/"
status = 200
headers = [
  ["Date", "{date}"],
  ["Server", "Apache/{apache_version} (Debian)"],
  ["X-Powered-By", "PHP/{php_version}"],
  ["Vary", "Accept-Encoding"],
  ["Content-Length", "{content_length}"],
  ["Keep-Alive", "timeout=5, max=100"],
  ["Connection", "Keep-Alive"],
  ["Content-Type", "text/html; charset=UTF-8"],
]
body = """
<!DOCTYPE html>
<html lang="en-US">
<head>
	<meta charset="UTF-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name='robots' content='max-image-preview:large' />
<title>My Blog</title>
<link rel="alternate" type="application/rss+xml" title="My Blog &raquo; Feed" href="/feed/" />
<link rel='stylesheet' id='wp-block-library-css' href='/wp-includes/css/dist/block-library/style.min.css?ver=6.8.3' media='all' />
<link rel='stylesheet' id='twentytwentyfive-style-css' href='/wp-content/themes/twentytwentyfive/style.css?ver=1.3' media='all' />
<link rel="https://api.w.org/" href="/wp-json/" />
<link rel="EditURI" type="application/rsd+xml" title="RSD" href="/xmlrpc.php?rsd" />
<meta name="generator" content="WordPress 6.8.3" />
</head>

<body class="home blog wp-embed-responsive">
<div class="wp-site-blocks">
<header class="wp-block-template-part">
<div class="wp-block-group alignwide">
<p class="wp-block-site-title"><a href="/" rel="home" aria-current="page">My Blog</a></p>
</div>
</header>
<main class="wp-block-group">
<h1 class="wp-block-heading">Blog</h1>
<ul class="wp-block-post-template">
<li class="wp-block-post post-1 post type-post status-publish format-standard hentry category-uncategorized">
<h2 class="wp-block-post-title"><a href="/?p=1" target="_self">Hello world!</a></h2>
<div class="wp-block-post-excerpt"><p class="wp-block-post-excerpt__excerpt">Welcome to WordPress. This is your first post. Edit or delete it, then start writing! </p></div>
</li>
</ul>
</main>
<footer class="wp-block-template-part">
<p class="has-small-font-size">Designed with <a href="https://wordpress.org" rel="nofollow">WordPress</a></p>
</footer>
</div>
<script src="/wp-includes/js/dist/interactivity.min.js?ver=6.8.3" id="wp-interactivity-js"></script>
</body>
</html>
"""

[[route]]
path = "/index.php"
status = 301
headers = [
  ["Date", "{date}"],
  ["Server", "Apache/{apache_version} (Debian)"],
  ["X-Powered-By", "PHP/{php_version}"],
  ["X-Redirect-By", "WordPress"],
  ["Location", "/"],
  ["Content-Length", "{content_length}"],
  ["Keep-Alive", "timeout=5, max=100"],
  ["Connection", "Keep-Alive"],
  ["Content-Type", "text/html; charset=UTF-8"],
]
body = ""

[[route]]
path = "/wp-login.php"
status = 200
headers = [
  ["Date", "{date}"],
  ["Server", "Apache/{apache_version} (Debian)"],
  ["X-Powered-By", "PHP/{php_version}"],
  ["Expires", "Wed, 11 Jan 1984 05:00:00 GMT"],
  ["Cache-Control", "no-cache, must-revalidate, max-age=0, no-store, private"],
  ["Set-Cookie", "wordpress_test_cookie=WP%20Cookie%20check; path=/"],
  ["X-Frame-Options", "SAMEORIGIN"],
  ["Vary", "Accept-Encoding"],
  ["Content-Length", "{content_length}"],
  ["Keep-Alive", "timeout=5, max=100"],
  ["Connection", "Keep-Alive"],
  ["Content-Type", "text/html; charset=UTF-8"],
]
body = """
<!DOCTYPE html>
<html lang="en-US">
	<head>
	<meta http-equiv="Content-Type" content="text/html; charset=UTF-8" />
	<title>Log In &lsaquo; My Blog &#8212; WordPress</title>
	<meta name='robots' content='max-image-preview:large, noindex, noarchive' />
<link rel='stylesheet' id='login-css' href='/wp-admin/css/login.min.css?ver=6.8.3' media='all' />
	<meta name='referrer' content='strict-origin-when-cross-origin' />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		</head>
	<body class="login no-js login-action-login wp-core-ui  locale-en-us">
	<div id="login">
		<h1 role="presentation" class="wp-login-logo"><a href="https://wordpress.org/">Powered by WordPress</a></h1>
		<form name="loginform" id="loginform" action="/wp-login.php" method="post">
			<p>
				<label for="user_login">Username or Email Address</label>
				<input type="text" name="log" id="user_login" class="input" value="" size="20" autocapitalize="off" autocomplete="username" required="required" />
			</p>
			<div class="user-pass-wrap">
				<label for="user_pass">Password</label>
				<div class="wp-pwd">
					<input type="password" name="pwd" id="user_pass" class="input password-input" value="" size="20" autocomplete="current-password" spellcheck="false" required="required" />
				</div>
			</div>
			<p class="forgetmenot"><input name="rememberme" type="checkbox" id="rememberme" value="forever"  /> <label for="rememberme">Remember Me</label></p>
			<p class="submit">
				<input type="submit" name="wp-submit" id="wp-submit" class="button button-primary button-large" value="Log In" />
				<input type="hidden" name="redirect_to" value="/wp-admin/" />
				<input type="hidden" name="testcookie" value="1" />
			</p>
		</form>
	</div>
	</body>
</html>
"""

[[route]]
path = "/xmlrpc.php"
status = 405
headers = [
  ["Date", "{date}"],
  ["Server", "Apache/{apache_version} (Debian)"],
  ["X-Powered-By", "PHP/{php_version}"],
  ["Allow", "POST"],
  ["Content-Length", "{content_length}"],
  ["Keep-Alive", "timeout=5, max=100"],
  ["Connection", "Keep-Alive"],
  ["Content-Type", "text/plain;charset=UTF-8"],
]
body = "XML-RPC server accepts POST requests only."

[[route]]
path = "/readme.html"
status = 200
headers = [
  ["Date", "{date}"],
  ["Server", "Apache/{apache_version} (Debian)"],
  ["Last-Modified", "Tue, 30 Sep 2025 20:41:12 GMT"],
  ["ETag", "\"1d8b-641d3e0a6c600\""],
  ["Accept-Ranges", "bytes"],
  ["Content-Length", "{content_length}"],
  ["Vary", "Accept-Encoding"],
  ["Keep-Alive", "timeout=5, max=100"],
  ["Connection", "Keep-Alive"],
  ["Content-Type", "text/html"],
]
body = """
<!DOCTYPE html>
<html lang="en">
<head>
	<meta name="viewport" content="width=device-width" />
	<meta http-equiv="Content-Type" content="text/html; charset=utf-8" />
	<title>WordPress &#8250; ReadMe</title>
	<link rel="stylesheet" href="wp-admin/css/install.css?ver=20100228" type="text/css" />
</head>
<body>
<h1 id="logo">
	<a href="https://wordpress.org/"><img alt="WordPress" src="wp-admin/images/wordpress-logo.png" /></a>
</h1>
<p style="text-align: center">Semantic Personal Publishing Platform</p>

<h2>First Things First</h2>
<p>Welcome. WordPress is a very special project to me. Every developer and contributor adds something unique to the mix, and together we create something beautiful that I am proud to be a part of. Thousands of hours have gone into WordPress, and we are dedicated to making it better every day. Thank you for making it part of your world.</p>
<p style="text-align: right">&#8212; Matt Mullenweg</p>

<h2>Installation: Famous 5-minute install</h2>
<ol>
	<li>Unzip the package in an empty directory and upload everything.</li>
	<li>Open <span class="file"><a href="wp-admin/install.php">wp-admin/install.php</a></span> in your browser. It will take you through the process to set up a <code>wp-config.php</code> file with your database connection details.</li>
</ol>

<h2>System Requirements</h2>
<ul>
	<li><a href="https://www.php.net/">PHP</a> version <strong>7.2.24</strong> or greater.</li>
	<li><a href="https://www.mysql.com/">MySQL</a> version <strong>5.5.5</strong> or greater.</li>
</ul>

<h2>License</h2>
<p>WordPress is free software, and is released under the terms of the <abbr>GPL</abbr> (GNU General Public License) version 2 or (at your option) any later version. See <a href="license.txt">license.txt</a>.</p>

</body>
</html>
"""

[[route]]
path = "/robots.txt"
status = 200
headers = [
  ["Date", "{date}"],
  ["Server", "Apache/{apache_version} (Debian)"],
  ["X-Powered-By", "PHP/{php_version}"],
  ["X-Robots-Tag", "noindex, follow"],
  ["Content-Length", "{content_length}"],
  ["Keep-Alive", "timeout=5, max=100"],
  ["Connection", "Keep-Alive"],
  ["Content-Type", "text/plain; charset=utf-8"],
]
body = """
User-agent: *
Disallow: /wp-admin/
Allow: /wp-admin/admin-ajax.php

Sitemap: /wp-sitemap.xml
"""

[not_found]
status = 404
headers = [
  ["Date", "{date}"],
  ["Server", "Apache/{apache_version} (Debian)"],
  ["Content-Length", "{content_length}"],
  ["Keep-Alive", "timeout=5, max=100"],
  ["Connection", "Keep-Alive"],
  ["Content-Type", "text/html; charset=iso-8859-1"],
]
body = """
<!DOCTYPE HTML PUBLIC "-//IETF//DTD HTML 2.0//EN">
<html><head>
<title>404 Not Found</title>
</head><body>
<h1>Not Found</h1>
<p>The requested URL was not found on this server.</p>
<hr>
<address>Apache/{apache_version} (Debian) Server at {hostname} Port 80</address>
</body></html>
"""

[bad_request]
status = 400
headers = [
  ["Date", "{date}"],
  ["Server", "Apache/{apache_version} (Debian)"],
  ["Content-Length", "{content_length}"],
  ["Connection", "close"],
  ["Content-Type", "text/html; charset=iso-8859-1"],
]
body = """
<!DOCTYPE HTML PUBLIC "-//IETF//DTD HTML 2.0//EN">
<html><head>
<title>400 Bad Request</title>
</head><body>
<h1>Bad Request</h1>
<p>Your browser sent a request that this server could not understand.<br />
</p>
<hr>
<address>Apache/{apache_version} (Debian) Server at {hostname} Port 80</address>
</body></html>
"""
