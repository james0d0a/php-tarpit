# Black-box lab: the hardened sensor plus client containers on an internal
# network whose only reachable host is the sensor. Driven by `cargo harness`;
# each test runs it under its own compose project name.
services:
  sensor:
    build: ..
    image: php_tarpit:harness
    user: "65532:65532"
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
      - NET_RAW
    environment:
      PHP_TARPIT_HOSTNAME: sensor
      # Small files, so a test's traffic spans several and rotation is visible.
      PHP_TARPIT_PCAP_FILE_BYTES: 256KiB
      RUST_LOG: info
    volumes:
      - sensor-data:/data
    networks:
      - lab

  curl:
    image: docker.io/curlimages/curl:8.23.0
    profiles: [clients]
    networks:
      - lab

  nuclei:
    build: clients/nuclei
    image: php_tarpit-harness-nuclei:v3.11.1
    profiles: [clients]
    networks:
      - lab

  # Reads the sensor's pcap and key log straight from its volume.
  tshark:
    build: clients/tshark
    image: php_tarpit-harness-tshark:bookworm
    profiles: [clients]
    volumes:
      - sensor-data:/data:ro
    networks:
      - lab

networks:
  lab:
    # No route out: clients (and anything they run) reach only the sensor.
    internal: true

volumes:
  sensor-data:
