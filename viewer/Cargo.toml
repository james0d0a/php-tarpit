[package]
name = "php_tarpit_viewer"
version = "0.1.0"
edition = "2024"
publish = false

# Its own workspace: the sensor build and image never pull in web dependencies.
[workspace]

[[bin]]
name = "php_tarpit_viewer"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.104"
axum = { version = "0.8.9", default-features = false, features = ["http1", "query", "tokio"] }
clap = { version = "4.6.7", features = ["derive", "env"] }
maud = "0.27.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
serde_urlencoded = "0.7.1"
tokio = { version = "1.54.1", features = ["fs", "io-util", "macros", "net", "rt-multi-thread", "signal"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
uuid = { version = "1.29.0", features = ["serde"] }

[dev-dependencies]
# php_tarpit: the contract test (tests/contract.rs) drives the real sensor.
bytes = "1.12.1"
h2 = "0.4.20"
http = "1.5.0"
php_tarpit = { path = ".." }
rustls = { version = "0.23.46", default-features = false, features = ["aws_lc_rs", "std", "logging", "tls12"] }
rustls-pki-types = "1.15.1"
tempfile = "3.27.0"
tokio-rustls = { version = "0.26.6", default-features = false, features = ["aws_lc_rs", "logging", "tls12"] }
